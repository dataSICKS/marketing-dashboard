openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Google sign-in and authenticator (TOTP) operations
  - name: newsletter
    description: Newsletter report operations
  - name: efo
    description: EFO CVR report operations
  - name: clarity
    description: Microsoft Clarity heatmap scroll depth data
  - name: campaigns
    description: Marketing campaign calendar
  - name: settings
    description: Application settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Sign-in configuration
      description: Whether sign-in is configured, which env vars are missing, and which email domains may sign in. Available without signing in.
      responses:
        "200":
          description: Sign-in configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current sign-in state
      description: Returns the stage of the current session. Only the "active" stage may call the data endpoints.
      responses:
        "200":
          description: Current sign-in state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "503":
          description: Sign-in is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthNotConfigured"

  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [auth]
      summary: Start authenticator enrollment
      description: Creates a provisional TOTP secret and returns the otpauth URI. Enrollment is only final once a code verifies.
      responses:
        "200":
          description: Provisional secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollResponse"
        "401":
          description: Not signed in
        "409":
          description: Already enrolled

  /auth/totp/verify:
    post:
      operationId: verifyTotp
      tags: [auth]
      summary: Verify a 6-digit code
      description: Completes the second factor. On first enrollment the backup codes are returned once and never again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInput"
      responses:
        "200":
          description: Second factor completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpVerifyResponse"
        "401":
          description: Code did not match
        "429":
          description: Temporarily locked after repeated failures

  /auth/backup-code/verify:
    post:
      operationId: verifyBackupCode
      tags: [auth]
      summary: Verify a backup code
      description: Single-use fallback when the authenticator is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInput"
      responses:
        "200":
          description: Second factor completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodeVerifyResponse"
        "401":
          description: Code did not match
        "429":
          description: Temporarily locked after repeated failures

  /auth/backup-codes/regenerate:
    post:
      operationId: regenerateBackupCodes
      tags: [auth]
      summary: Issue a new set of backup codes
      description: Replaces every existing backup code. Requires an active session.
      responses:
        "200":
          description: New backup codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodesResponse"
        "401":
          description: Not signed in

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutInput"
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"

  /newsletter/sync:
    post:
      operationId: syncNewsletter
      tags: [newsletter]
      summary: Sync newsletter data from Google Sheets
      description: Fetches latest data from the calc sheet and returns it
      responses:
        "200":
          description: Synced newsletter rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSyncResult"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/data:
    get:
      operationId: getNewsletterData
      tags: [newsletter]
      summary: Get newsletter report data
      description: Returns aggregated newsletter metrics grouped by the specified dimension
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, template, scenario]
            default: day
          description: Aggregation dimension
        - name: anchorDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Campaign date; align weeks to consecutive 7-day periods and months to this date instead of calendar boundaries
        - name: timeGroupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
          description: Time granularity within scenario/template groups; weeks start on Monday
        - name: dateFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter start date (YYYY/MM/DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter end date (YYYY/MM/DD)
        - name: scenarioName
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by scenario name (pipe-separated for multiple)
        - name: templateName
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by template name (pipe-separated for multiple)
        - name: compareFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Comparison period start date (YYYY/MM/DD)
        - name: compareTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Comparison period end date (YYYY/MM/DD)
      responses:
        "200":
          description: Newsletter report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterReportResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/change-events:
    get:
      operationId: getNewsletterChangeEvents
      tags: [newsletter]
      summary: Get template/subject change events
      description: Returns dates when email subject or template name changed, used for before/after comparison
      parameters:
        - name: scenarioName
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by scenario name
        - name: segment
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by segment name
      responses:
        "200":
          description: Change events list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterChangeEventsResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/segments:
    get:
      operationId: getNewsletterSegments
      tags: [newsletter]
      summary: Get available segments
      description: Returns a list of all unique segment values in the data
      responses:
        "200":
          description: Segment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSegmentsResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/templates:
    get:
      operationId: getNewsletterTemplates
      tags: [newsletter]
      summary: Get available templates
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterTemplatesResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/optout:
    get:
      operationId: getNewsletterOptout
      tags: [newsletter]
      summary: Get newsletter opt-out counts
      description: Returns opt-out counts aggregated by day, week or month for the given period
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
            default: day
          description: Aggregation dimension
        - name: dateFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter start date (YYYY-MM-DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter end date (YYYY-MM-DD)
        - name: compareFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Comparison period start date (YYYY-MM-DD)
        - name: compareTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Comparison period end date (YYYY-MM-DD)
      responses:
        "200":
          description: Newsletter opt-out data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterOptoutResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /line/sync:
    post:
      operationId: syncLine
      tags: [line]
      summary: Re-read the LINE performance sheet and store daily zone metrics, parameter-URL master and per-URL CV
      responses:
        "200":
          description: Stored row counts and the identity checks that failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineSyncResult"
        "503":
          description: Sheet or database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /line/data:
    get:
      operationId: getLineData
      tags: [line]
      summary: Friend balance, new additions, blocks, LP access and CV by acquisition route
      parameters:
        - { name: grain, in: query, schema: { type: string, enum: [day, week, month], default: day } }
        - { name: dateFrom, in: query, schema: { type: string }, description: Lower bound YYYY-MM-DD }
        - { name: dateTo, in: query, schema: { type: string }, description: Upper bound YYYY-MM-DD }
        - { name: zones, in: query, schema: { type: string }, description: Pipe-separated zone keys; empty means every zone }
      responses:
        "200":
          description: Stock metrics are period-end values and flow metrics are period sums; they are never added together
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineDataResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /line/deliveries:
    get:
      operationId: getLineDeliveries
      tags: [line]
      summary: CV by message pack, step number and segment, from the parameter-URL identifiers
      parameters:
        - { name: dateFrom, in: query, schema: { type: string } }
        - { name: dateTo, in: query, schema: { type: string } }
      responses:
        "200":
          description: CV only; per-identifier LP access does not exist, so there is no delivery-level CVR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineDeliveriesResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ltv/optout-analysis:
    get:
      operationId: getLtvOptoutAnalysis
      tags: [ltv]
      summary: Analyze opt-out timing by customer code across all-channel purchases and observed email history
      parameters:
        - { name: monthFrom, in: query, schema: { type: string }, description: First observed purchase month lower bound YYYY-MM }
        - { name: monthTo, in: query, schema: { type: string }, description: First observed purchase month upper bound YYYY-MM }
        - { name: optoutFrom, in: query, schema: { type: string }, description: Estimated opt-out date lower bound YYYY-MM-DD }
        - { name: optoutTo, in: query, schema: { type: string }, description: Estimated opt-out date upper bound YYYY-MM-DD }
        - { name: customerCode, in: query, schema: { type: string }, description: Customer code substring; preserves leading zeroes }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Filtered customer-level analysis; counts are customers, not subscriptions or events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LtvOptoutAnalysis"
        "400":
          description: Invalid analysis filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Purchase or opt-out source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ltv/optout-mail-analysis:
    get:
      operationId: getOptoutMailAnalysis
      tags: [ltv]
      summary: Relate completed email deliveries to opt-out, by sequence position, node, send frequency and LTV
      parameters:
        - { name: minEvents, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 200 }, description: Minimum delivery events for a node row to be listed; smaller groups are grouped as low volume }
      responses:
        "200":
          description: Hazard rates with explicit denominators; never bare counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptoutMailAnalysis"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Delivery, opt-out or purchase source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ltv/optout-analysis/refresh:
    post:
      operationId: refreshLtvOptoutAnalysis
      tags: [ltv]
      summary: Manually refresh read-only opt-out and mail snapshots; does not modify purchase data
      responses:
        "200":
          description: Sources refreshed; invalidate the analysis query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LtvOptoutRefreshResult"
        "503":
          description: Required source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ltv/sync:
    post:
      operationId: syncLtv
      tags: [ltv]
      summary: Sync LTV data from Google Sheets
      parameters:
        - name: dataset
          in: query
          required: false
          schema:
            type: string
            enum: [fb, all]
            default: all
          description: "省略すると全経路のみ取り込む。fbの明示指定は旧データとの互換性のため維持"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LtvSyncResult"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ltv/filters:
    get:
      operationId: getLtvFilters
      tags: [ltv]
      summary: Get available LTV filter values
      parameters:
        - name: dataset
          in: query
          required: false
          schema:
            type: string
            enum: [fb, all]
            default: all
      responses:
        "200":
          description: Filter values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LtvFiltersResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ltv/data:
    get:
      operationId: getLtvData
      tags: [ltv]
      summary: Get LTV by first-order month
      description: Average LTV95/180/365 per subscription, grouped by month or the entire filtered period and an optional breakdown axis. Period averages are computed from raw subscriptions, not rounded monthly averages.
      parameters:
        - name: dataset
          in: query
          required: false
          schema:
            type: string
            enum: [fb, all]
            default: all
          description: "fb = FB広告経由・2024/06以降 / all = 全経路・2026/01以降"
        - name: monthFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: First-order month lower bound (YYYY-MM-DD, month start)
        - name: monthTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: First-order month upper bound (YYYY-MM-DD, month start)
        - name: timeGroupBy
          in: query
          required: false
          schema:
            type: string
            enum: [month, total]
            default: month
          description: Month columns or a single total for the filtered first-order month range
        - name: splitBy
          in: query
          required: false
          schema:
            type: string
            enum: [none, optout, offer, firstProduct, subsStatus, adGroup, sellingUrl, toothpaste1, toothpaste2, toothpaste3, toothpaste4]
            default: none
          description: Breakdown axis
        - name: toothpaste1
          in: query
          schema:
            type: string
            enum: [all, yes, no, unknown]
            default: all
          description: First-purchase toothpaste label; missing product data is unknown, not no
        - name: toothpaste2
          in: query
          schema:
            type: string
            enum: [all, yes, no, unknown]
            default: all
          description: Second-purchase toothpaste label
        - name: toothpaste3
          in: query
          schema:
            type: string
            enum: [all, yes, no, unknown]
            default: all
          description: Third-purchase toothpaste label
        - name: toothpaste4
          in: query
          schema:
            type: string
            enum: [all, yes, no, unknown]
            default: all
          description: Fourth-purchase toothpaste label; filters across stages are combined with AND
        - name: optout
          in: query
          required: false
          schema:
            type: string
            enum: [all, yes, no]
            default: all
          description: Restrict to customers who did or did not opt out
        - name: offers
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Pipe-separated offer names
        - name: firstProducts
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Pipe-separated first-purchase product labels
        - name: subsStatuses
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Pipe-separated subscription statuses
        - name: adGroups
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Pipe-separated ad group names
        - name: sellingUrls
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: JSON-encoded array of exact selling URL labels; preserves URL query strings and pipe characters
      responses:
        "200":
          description: LTV data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LtvDataResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/matrix:
    get:
      operationId: getNewsletterMatrix
      tags: [newsletter]
      summary: Get newsletter comparison matrix
      parameters:
        - name: dimensions
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated grouping dimensions (scenario, subject, template); an empty string groups all matching deliveries into a total
        - name: anchorDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Campaign date used to align time buckets
        - name: timeGroupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
            default: month
        - name: metrics
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated metrics
        - name: includeOptout
          in: query
          required: false
          schema:
            type: string
            enum: ["true"]
          description: "指定すると「オプトアウト（全体）」専用系列を 1 行追加する。オプトアウトはシナリオ/テンプレートに紐づかないため metrics では指定できない"
        - name: scenarios
          in: query
          required: false
          schema:
            type: string
          description: Pipe-separated scenario names
        - name: templates
          in: query
          required: false
          schema:
            type: string
          description: Pipe-separated template names
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Newsletter comparison matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrixResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clarity/coverage:
    get:
      operationId: getClarityCoverage
      tags: [clarity]
      summary: Audit saved CSV coverage for each configured advertising code
      responses:
        "200":
          description: Storage inventory, not proof of visits or successful collection on absent dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClarityCoverageResponse"
        "500":
          description: Storage inventory failed

  /clarity/files:
    get:
      operationId: getClarityFiles
      tags: [clarity]
      summary: List available Clarity heatmap files
      description: Returns available dates and ad codes stored in Supabase Storage
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Date folder to list (YYYY-MM-DD). Omit to get all available dates.
      responses:
        "200":
          description: Available dates and ad codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClarityFilesResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clarity/scroll:
    get:
      operationId: getClarityScroll
      tags: [clarity]
      summary: Get scroll depth data for an ad code
      description: Returns scroll depth visitor counts for Desktop and/or Mobile devices
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Date folder (YYYY-MM-DD)
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
          description: Range start date (YYYY-MM-DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
          description: Range end date (YYYY-MM-DD)
        - name: adCode
          in: query
          required: true
          schema:
            type: string
          description: Ad code to fetch scroll data for
      responses:
        "200":
          description: Scroll depth data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClarityScrollResponse"
        "400":
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/filters:
    get:
      operationId: getEfoFilters
      tags: [efo]
      summary: Get available EFO filter values
      description: Returns unique profile names and ad codes active in the given date range
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter start date (YYYY-MM-DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter end date (YYYY-MM-DD)
      responses:
        "200":
          description: Available filter values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoFilters"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/sync:
    post:
      operationId: syncEfo
      tags: [efo]
      summary: Sync EFO data from Google Sheets
      description: Fetches latest EFO access/cv and exit scenario data from Google Sheets
      responses:
        "200":
          description: Synced EFO data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoSyncResult"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/data:
    get:
      operationId: getEfoData
      tags: [efo]
      summary: Get EFO CVR report data
      description: Returns aggregated EFO metrics and exit scenario funnel
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, template]
            default: day
          description: Aggregation dimension
        - name: dateFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter start date (YYYY/MM/DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter end date (YYYY/MM/DD)
        - name: profileName
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by profile name
        - name: adCode
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by ad code
      responses:
        "200":
          description: EFO report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoReportResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get application settings
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignListResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /campaigns/{id}:
    put:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/presets:
    get:
      operationId: listEfoPresets
      tags: [efo]
      summary: List all EFO presets
      responses:
        "200":
          description: Preset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoPresetListResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createEfoPreset
      tags: [efo]
      summary: Create an EFO preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EfoPresetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoPresetResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/presets/{id}:
    patch:
      operationId: renameEfoPreset
      tags: [efo]
      summary: Update an EFO preset name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EfoPresetNameInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoPresetResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: overwriteEfoPreset
      tags: [efo]
      summary: Overwrite an EFO preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EfoPresetInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoPresetResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEfoPreset
      tags: [efo]
      summary: Delete an EFO preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    NewsletterRow:
      type: object
      properties:
        deliveryYearMonth:
          type: string
          description: 配信年月 (YYYY/MM)
        deliveryWeek:
          type: string
          description: 配信月週 (e.g. 9月2W)
        deliveryDate:
          type: string
          description: 配信日 (YYYY/MM/DD)
        scenarioName:
          type: string
          description: シナリオ名
        segment:
          type: string
          description: セグメント
        deliveryMethod:
          type: string
          description: 配信方法
        templateName:
          type: string
          description: テンプレート名
        subject:
          type: string
          description: 件名
        deliveryCount:
          type: number
          description: 配信数
        openCount:
          type: number
          description: 開封数
        clickCount:
          type: number
          description: クリック数
        cvCount:
          type: number
          description: CV数
      required:
        - deliveryYearMonth
        - deliveryWeek
        - deliveryDate
        - scenarioName
        - segment
        - deliveryMethod
        - templateName
        - subject
        - deliveryCount
        - openCount
        - clickCount
        - cvCount

    NewsletterSyncResult:
      type: object
      properties:
        rowCount:
          type: number
          description: Number of rows synced
        optoutRowCount:
          type: ["number", "null"]
          description: Number of opt-out rows synced
        syncedAt:
          type: string
          description: ISO timestamp of sync
      required:
        - rowCount
        - syncedAt

    NewsletterOptoutItem:
      type: object
      properties:
        label:
          type: string
          description: Period label (day = YYYY/MM/DD, week = M月nW, month = YYYY/MM)
        optoutCount:
          type: number
          description: Number of opt-outs in the period
        prevOptoutCount:
          type: ["number", "null"]
          description: Number of opt-outs in the comparison period
      required:
        - label
        - optoutCount

    NewsletterOptoutSummary:
      type: object
      properties:
        optoutCount:
          type: number
          description: Total opt-outs in the selected period
        prevOptoutCount:
          type: ["number", "null"]
          description: Total opt-outs in the comparison period
      required:
        - optoutCount

    NewsletterOptoutResponse:
      type: object
      properties:
        groupBy:
          type: string
          enum: [day, week, month]
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsletterOptoutItem"
        summary:
          $ref: "#/components/schemas/NewsletterOptoutSummary"
        dataFrom:
          type: ["string", "null"]
          description: Earliest opt-out date available in the dataset (YYYY-MM-DD)
        lastSyncedAt:
          type: ["string", "null"]
      required:
        - groupBy
        - items
        - summary

    LtvSyncResult:
      type: object
      properties:
        rowCount:
          type: number
        perDataset:
          type: object
          additionalProperties:
            type: number
        syncedAt:
          type: string
      required:
        - rowCount
        - syncedAt

    LtvOptoutRefreshResult:
      type: object
      required: [fetchedAt, mailAvailable]
      properties:
        fetchedAt: { type: string }
        mailAvailable: { type: boolean }

    LtvOptoutSources:
      type: object
      required: [purchaseSyncedAt, fetchedAt, mailAvailable, mailFrom, mailTo, optoutFrom, optoutTo, mailRows, completedMailRows, excludedMailRows, duplicateMailRows, invalidMailRows, mailError]
      properties:
        purchaseSyncedAt: { type: [string, "null"] }
        fetchedAt: { type: string }
        mailAvailable: { type: boolean }
        mailFrom: { type: [string, "null"] }
        mailTo: { type: [string, "null"] }
        optoutFrom: { type: [string, "null"] }
        optoutTo: { type: [string, "null"] }
        mailRows: { type: integer }
        completedMailRows: { type: integer }
        excludedMailRows: { type: integer }
        duplicateMailRows: { type: integer }
        invalidMailRows: { type: integer }
        mailError: { type: [string, "null"] }

    LtvOptoutSummary:
      type: object
      required: [purchaseCustomers, optoutCustomers, unmatchedOptoutCustomers, unknownPurchaseMonthCustomers, beforePurchaseOnlyCustomers, matchedCustomers, analyzedCustomers, observedMailCustomers, cumulativeUnknownCustomers, sameDayMailCustomers]
      properties:
        purchaseCustomers: { type: integer }
        optoutCustomers: { type: integer }
        unmatchedOptoutCustomers: { type: integer }
        unknownPurchaseMonthCustomers: { type: integer }
        beforePurchaseOnlyCustomers: { type: integer }
        matchedCustomers: { type: integer, description: Matched customers before user filters }
        analyzedCustomers: { type: integer, description: All filtered customers before pagination; distribution denominator }
        observedMailCustomers: { type: integer, description: Customers with at least one recorded completed email strictly before the opt-out date }
        cumulativeUnknownCustomers: { type: integer }
        sameDayMailCustomers: { type: integer }

    LtvOptoutMonthBucket:
      type: object
      required: [monthIndex, count, share]
      properties:
        monthIndex: { type: integer, minimum: 1, description: First purchase month is month 1; calendar month difference plus one }
        count: { type: integer }
        share: { type: number, description: Fraction of filtered matched customers; not an opt-out risk rate }

    LtvOptoutMailBucket:
      type: object
      required: [observedCount, label, count, share]
      properties:
        observedCount: { type: [integer, "null"], description: Null means no usable prior records; never an asserted lifetime zero }
        label: { type: string }
        count: { type: integer }
        share: { type: number }

    LtvOptoutCustomer:
      type: object
      required: [customerCode, firstPurchaseMonth, optoutDate, monthIndex, subscriptionCount, observedBeforeCount, sameDayCount, cumulativeCount, mailStatus]
      properties:
        customerCode: { type: string }
        firstPurchaseMonth: { type: string }
        optoutDate: { type: string }
        monthIndex: { type: integer }
        subscriptionCount: { type: integer }
        observedBeforeCount: { type: [integer, "null"] }
        sameDayCount: { type: [integer, "null"] }
        cumulativeCount: { type: [integer, "null"], description: Always null with currently incomplete history }
        mailStatus:
          type: string
          enum: [history_incomplete, same_day_only, outside_period, no_matching_history, unavailable]

    LtvOptoutAnalysis:
      type: object
      required: [sources, summary, monthDistribution, mailDistribution, customers, page, pageSize, totalPages, notes]
      properties:
        sources:
          $ref: "#/components/schemas/LtvOptoutSources"
        summary:
          $ref: "#/components/schemas/LtvOptoutSummary"
        monthDistribution:
          type: array
          items:
            $ref: "#/components/schemas/LtvOptoutMonthBucket"
        mailDistribution:
          type: array
          items:
            $ref: "#/components/schemas/LtvOptoutMailBucket"
        customers:
          type: array
          items:
            $ref: "#/components/schemas/LtvOptoutCustomer"
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        notes:
          type: array
          items: { type: string }

    LineRowIssue:
      type: object
      required: [date, check, detail]
      properties:
        date: { type: string }
        check: { type: string, description: Which identity from the sheet's glossary failed }
        detail: { type: string }

    LineSyncResult:
      type: object
      required: [dailyRows, zoneRows, masterRows, cvRows, issues, masterSkipped, masterDuplicates, cvIdentifiers, syncedAt, columnCountWarning, tabs]
      properties:
        dailyRows: { type: integer }
        zoneRows: { type: integer }
        masterRows: { type: integer }
        cvRows: { type: integer, description: Only non-zero CV is stored }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/LineRowIssue"
        masterSkipped: { type: integer, description: Parameter-URL rows with no identifier yet }
        masterDuplicates: { type: integer }
        cvIdentifiers: { type: integer }
        syncedAt: { type: string }
        columnCountWarning: { type: [string, "null"], description: Set when the daily tab is no longer 109 columns wide }
        tabs:
          type: array
          description: Tab titles with their gid, so a shared sheet link can be matched to a tab
          items:
            $ref: "#/components/schemas/LineSheetTab"

    LineSheetTab:
      type: object
      required: [title, sheetId, rowCount, columnCount]
      properties:
        title: { type: string }
        sheetId: { type: integer, description: The gid in the spreadsheet URL }
        rowCount: { type: integer }
        columnCount: { type: integer }

    LineZoneOption:
      type: object
      required: [key, label, hasBalance, hasCv, hasScenario]
      properties:
        key: { type: string }
        label: { type: string }
        hasBalance: { type: boolean, description: False for routes that only carry CV, such as the rich menu }
        hasCv: { type: boolean }
        hasScenario: { type: boolean }

    LineZonePeriod:
      type: object
      required: [period, zone, days, newCount, instantBlock, blockDelta, lpAccess, cv, people, blockTotal, active, scenarioCount, activeDelta, instantBlockRate, blockRate, scenarioRate, cvrLp, convRate]
      properties:
        period: { type: string, description: Day, the week's Monday, or the month's first day }
        zone: { type: string }
        days: { type: integer, description: Days with data in this period; a short count means gaps }
        newCount: { type: [integer, "null"], description: Flow; summed }
        instantBlock: { type: [integer, "null"] }
        blockDelta: { type: [integer, "null"] }
        lpAccess: { type: [integer, "null"] }
        cv: { type: [integer, "null"] }
        people: { type: [integer, "null"], description: Stock; the period's closing value, never a sum }
        blockTotal: { type: [integer, "null"] }
        active: { type: [integer, "null"], description: people minus blockTotal; the figure to call the friend count }
        scenarioCount: { type: [integer, "null"] }
        activeDelta: { type: [integer, "null"], description: Closing active minus the previous period's closing active }
        instantBlockRate: { type: [number, "null"] }
        blockRate: { type: [number, "null"] }
        scenarioRate: { type: [number, "null"] }
        cvrLp: { type: [number, "null"], description: CV divided by LP access on the same rows }
        convRate: { type: [number, "null"], description: CV divided by new additions; not a same-cohort rate }

    LineSummary:
      type: object
      required: [activeLatest, activeLatestDate, peopleLatest, blockTotalLatest, blockRateLatest, newCount, instantBlock, instantBlockRate, lpAccess, cv, cvrLp, convRate]
      properties:
        activeLatest: { type: [integer, "null"], description: Latest closing balance, not a period total }
        activeLatestDate: { type: [string, "null"] }
        peopleLatest: { type: [integer, "null"] }
        blockTotalLatest: { type: [integer, "null"] }
        blockRateLatest: { type: [number, "null"] }
        newCount: { type: integer }
        instantBlock: { type: integer }
        instantBlockRate: { type: [number, "null"] }
        lpAccess: { type: integer }
        cv: { type: integer }
        cvrLp: { type: [number, "null"] }
        convRate: { type: [number, "null"] }

    LineDataResponse:
      type: object
      required: [grain, zones, items, summary, issues, columnCountWarning, dateMin, dateMax, lastSyncedAt, notes]
      properties:
        grain: { type: string, enum: [day, week, month] }
        zones:
          type: array
          items:
            $ref: "#/components/schemas/LineZoneOption"
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineZonePeriod"
        summary:
          $ref: "#/components/schemas/LineSummary"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/LineRowIssue"
        columnCountWarning: { type: [string, "null"] }
        dateMin: { type: [string, "null"] }
        dateMax: { type: [string, "null"] }
        lastSyncedAt: { type: [string, "null"] }
        notes:
          type: array
          items: { type: string }

    LineDeliveryItem:
      type: object
      required: [messagePack, route, stepNumber, variants, cv, hasCoupon, firstCvDate, lastCvDate]
      properties:
        messagePack: { type: string }
        route: { type: string }
        stepNumber: { type: [integer, "null"], description: Null when neither the column nor the circled numeral gave one }
        variants: { type: integer, description: Identifiers under this pack that produced CV, one per segment branch }
        cv: { type: integer }
        hasCoupon: { type: [boolean, "null"] }
        firstCvDate: { type: [string, "null"] }
        lastCvDate: { type: [string, "null"] }

    LineDeliverySplit:
      type: object
      required: [key, label, cv]
      properties:
        key: { type: string }
        label: { type: string }
        cv: { type: integer }

    LineDeliveryUnmatched:
      type: object
      required: [identifier, cv]
      properties:
        identifier: { type: string }
        cv: { type: integer }

    LineDeliveriesResponse:
      type: object
      required: [items, unmatched, bySubscription, byChild, byRoute, totalCv, matchedCv, identifierCount, dateMin, dateMax, lastSyncedAt, notes]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineDeliveryItem"
        unmatched:
          type: array
          description: CV on identifiers absent from the parameter-URL sheet; a sign new URLs were issued without being registered
          items:
            $ref: "#/components/schemas/LineDeliveryUnmatched"
        bySubscription:
          type: array
          items:
            $ref: "#/components/schemas/LineDeliverySplit"
        byChild:
          type: array
          items:
            $ref: "#/components/schemas/LineDeliverySplit"
        byRoute:
          type: array
          items:
            $ref: "#/components/schemas/LineDeliverySplit"
        totalCv: { type: integer, description: Includes unmatched CV, so the parts can be reconciled }
        matchedCv: { type: integer }
        identifierCount: { type: integer }
        dateMin: { type: [string, "null"] }
        dateMax: { type: [string, "null"] }
        lastSyncedAt: { type: [string, "null"] }
        notes:
          type: array
          items: { type: string }

    OptoutMailCoverage:
      type: object
      required: [deliveryFrom, deliveryTo, optoutFrom, optoutTo, deliveryEvents, deliveryCustomers, cohortCustomers, cohortOptouts, excludedEarlyCustomers, undecidableSameDay, undecidableNoHistory, aggregateDeliveries, coverageRatio, purchaseSyncedAt, fetchedAt]
      properties:
        deliveryFrom: { type: [string, "null"], description: Earliest completed email date in the history }
        deliveryTo: { type: [string, "null"] }
        optoutFrom: { type: [string, "null"], description: Earliest estimated opt-out date; the cohort starts here }
        optoutTo: { type: [string, "null"] }
        deliveryEvents: { type: integer, description: Completed email events after excluding undeliverable and skipped }
        deliveryCustomers: { type: integer }
        cohortCustomers: { type: integer, description: Customers whose first delivery is on or after optoutFrom; the only group where an opt-out is observable }
        cohortOptouts: { type: integer }
        excludedEarlyCustomers: { type: integer, description: Customers whose first delivery predates opt-out data and whose opt-out could be invisible }
        undecidableSameDay: { type: integer, description: Opt-outs whose only prior record is the same estimated day; order within a day is unknown }
        undecidableNoHistory: { type: integer }
        aggregateDeliveries:
          type: [integer, "null"]
          description: Deliveries the aggregate report counts over the same window; null when it could not be read
        coverageRatio:
          type: [number, "null"]
          description: Per-customer records divided by aggregate deliveries. Below 1 means some scenarios were never exported, so a customer's Nth email is only the Nth among the records we hold
        purchaseSyncedAt: { type: [string, "null"] }
        fetchedAt: { type: string }

    OptoutMailMissingScenario:
      type: object
      required: [scenarioName, deliveries, missingDeliveries]
      properties:
        scenarioName: { type: string }
        deliveries: { type: integer, description: Deliveries the aggregate report counts for this scenario in the window }
        missingDeliveries: { type: integer, description: Of those, deliveries with no per-customer record; export this scenario again to close the gap }

    OptoutMailSequenceBucket:
      type: object
      required: [sequence, reached, churned, hazard, cumulativeShare]
      properties:
        sequence: { type: integer, minimum: 1, description: Nth completed email counted strictly before the estimated opt-out date }
        reached: { type: integer, description: Cohort customers who received at least this many emails; the denominator }
        churned: { type: integer, description: Customers whose last email before opting out was this one }
        hazard: { type: number, description: churned divided by reached }
        cumulativeShare: { type: number, description: Share of the whole cohort that has opted out by this point }

    OptoutMailNodeItem:
      type: object
      required: [label, templateName, nodeId, scenarioName, events, customers, churned, hazard, medianSequence]
      properties:
        label: { type: string, description: Display name; falls back to scenario plus node when the template was deleted in MA }
        templateName: { type: string }
        nodeId: { type: string }
        scenarioName: { type: string }
        events: { type: integer, description: Delivery events for this node; the denominator }
