          enum: [unauthenticated, totp_setup, totp_required, active]
          description: Only "active" has passed both Google sign-in and the authenticator code
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        pictureUrl:
          type: ["string", "null"]
        totpEnrolled:
          type: boolean
        backupCodesRemaining:
          type: ["integer", "null"]
        lockedForSeconds:
          type: integer
          description: Seconds left on the lock after repeated failed codes

    TotpEnrollResponse:
      type: object
      required: [secret, secretFormatted, otpauthUri, issuer, account]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry
        secretFormatted:
          type: string
          description: The same secret grouped in fours, for reading aloud or typing
        otpauthUri:
          type: string
        issuer:
          type: string
        account:
          type: string

    CodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    TotpVerifyResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string
        backupCodes:
          type: ["array", "null"]
          description: Returned once, on first enrollment only
          items:
            type: string

    BackupCodeVerifyResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string
        backupCodesRemaining:
          type: integer

    BackupCodesResponse:
      type: object
      required: [backupCodes]
      properties:
        backupCodes:
          type: array
          items:
            type: string

    LogoutInput:
      type: object
      properties:
        all:
          type: boolean
          description: Also revoke the sessions on the person's other devices

    LogoutResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
