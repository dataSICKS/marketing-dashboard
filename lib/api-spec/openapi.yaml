      required: [cohortMonth, withoutCount, withoutLtv95, withoutLtv180, withoutLtv365, withCount, withLtv95, withLtv180, withLtv365, optoutRate, mature180, mature365]
      properties:
        cohortMonth: { type: string, description: First observed purchase month YYYY-MM }
        withoutCount: { type: integer }
        withoutLtv95: { type: integer }
        withoutLtv180: { type: integer }
        withoutLtv365: { type: integer }
        withCount: { type: integer }
        withLtv95: { type: integer }
        withLtv180: { type: integer }
        withLtv365: { type: integer }
        optoutRate: { type: number, description: Opt-out customers divided by all customers in the cohort; longer-standing cohorts had more time to opt out }
        mature180: { type: boolean, description: False when 180 days have not elapsed for the whole cohort, so the average is still rising }
        mature365: { type: boolean }

