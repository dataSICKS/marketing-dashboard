openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: newsletter
    description: Newsletter report operations
  - name: efo
    description: EFO CVR report operations
  - name: clarity
    description: Microsoft Clarity heatmap scroll depth data
  - name: campaigns
    description: Marketing campaign calendar
  - name: settings
    description: Application settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /newsletter/sync:
    post:
      operationId: syncNewsletter
      tags: [newsletter]
      summary: Sync newsletter data from Google Sheets
      description: Fetches latest data from the calc sheet and returns it
      responses:
        "200":
          description: Synced newsletter rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSyncResult"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/data:
    get:
      operationId: getNewsletterData
      tags: [newsletter]
      summary: Get newsletter report data
      description: Returns aggregated newsletter metrics grouped by the specified dimension
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, template, scenario]
            default: day
          description: Aggregation dimension
        - name: anchorDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Campaign date; align weeks to consecutive 7-day periods and months to this date instead of calendar boundaries
        - name: timeGroupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
          description: Time granularity within scenario/template groups; weeks start on Monday
        - name: dateFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter start date (YYYY/MM/DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter end date (YYYY/MM/DD)
        - name: scenarioName
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by scenario name (pipe-separated for multiple)
        - name: templateName
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by template name (pipe-separated for multiple)
        - name: compareFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Comparison period start date (YYYY/MM/DD)
        - name: compareTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Comparison period end date (YYYY/MM/DD)
      responses:
        "200":
          description: Newsletter report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterReportResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/change-events:
    get:
      operationId: getNewsletterChangeEvents
      tags: [newsletter]
      summary: Get template/subject change events
      description: Returns dates when email subject or template name changed, used for before/after comparison
      parameters:
        - name: scenarioName
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by scenario name
        - name: segment
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by segment name
      responses:
        "200":
          description: Change events list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterChangeEventsResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/segments:
    get:
      operationId: getNewsletterSegments
      tags: [newsletter]
      summary: Get available segments
      description: Returns a list of all unique segment values in the data
      responses:
        "200":
          description: Segment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSegmentsResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/templates:
    get:
      operationId: getNewsletterTemplates
      tags: [newsletter]
      summary: Get available templates
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterTemplatesResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/optout:
    get:
      operationId: getNewsletterOptout
      tags: [newsletter]
      summary: Get newsletter opt-out counts
      description: Returns opt-out counts aggregated by day, week or month for the given period
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
            default: day
          description: Aggregation dimension
        - name: dateFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter start date (YYYY-MM-DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter end date (YYYY-MM-DD)
        - name: compareFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Comparison period start date (YYYY-MM-DD)
        - name: compareTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Comparison period end date (YYYY-MM-DD)
      responses:
        "200":
          description: Newsletter opt-out data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterOptoutResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter/matrix:
    get:
      operationId: getNewsletterMatrix
      tags: [newsletter]
      summary: Get newsletter comparison matrix
      parameters:
        - name: dimensions
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated grouping dimensions (scenario, subject, template); an empty string groups all matching deliveries into a total
        - name: anchorDate
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Campaign date used to align time buckets
        - name: timeGroupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
            default: month
        - name: metrics
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated metrics
        - name: includeOptout
          in: query
          required: false
          schema:
            type: string
            enum: ["true"]
          description: "指定すると「オプトアウト（全体）」専用系列を 1 行追加する。オプトアウトはシナリオ/テンプレートに紐づかないため metrics では指定できない"
        - name: scenarios
          in: query
          required: false
          schema:
            type: string
          description: Pipe-separated scenario names
        - name: templates
          in: query
          required: false
          schema:
            type: string
          description: Pipe-separated template names
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Newsletter comparison matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrixResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clarity/coverage:
    get:
      operationId: getClarityCoverage
      tags: [clarity]
      summary: Audit saved CSV coverage for each configured advertising code
      responses:
        "200":
          description: Storage inventory, not proof of visits or successful collection on absent dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClarityCoverageResponse"
        "500":
          description: Storage inventory failed

  /clarity/files:
    get:
      operationId: getClarityFiles
      tags: [clarity]
      summary: List available Clarity heatmap files
      description: Returns available dates and ad codes stored in Supabase Storage
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Date folder to list (YYYY-MM-DD). Omit to get all available dates.
      responses:
        "200":
          description: Available dates and ad codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClarityFilesResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clarity/scroll:
    get:
      operationId: getClarityScroll
      tags: [clarity]
      summary: Get scroll depth data for an ad code
      description: Returns scroll depth visitor counts for Desktop and/or Mobile devices
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Date folder (YYYY-MM-DD)
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
          description: Range start date (YYYY-MM-DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
          description: Range end date (YYYY-MM-DD)
        - name: adCode
          in: query
          required: true
          schema:
            type: string
          description: Ad code to fetch scroll data for
      responses:
        "200":
          description: Scroll depth data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClarityScrollResponse"
        "400":
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/filters:
    get:
      operationId: getEfoFilters
      tags: [efo]
      summary: Get available EFO filter values
      description: Returns unique profile names and ad codes active in the given date range
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter start date (YYYY-MM-DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter end date (YYYY-MM-DD)
      responses:
        "200":
          description: Available filter values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoFilters"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/sync:
    post:
      operationId: syncEfo
      tags: [efo]
      summary: Sync EFO data from Google Sheets
      description: Fetches latest EFO access/cv and exit scenario data from Google Sheets
      responses:
        "200":
          description: Synced EFO data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoSyncResult"
        "500":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/data:
    get:
      operationId: getEfoData
      tags: [efo]
      summary: Get EFO CVR report data
      description: Returns aggregated EFO metrics and exit scenario funnel
      parameters:
        - name: groupBy
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, template]
            default: day
          description: Aggregation dimension
        - name: dateFrom
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter start date (YYYY/MM/DD)
        - name: dateTo
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter end date (YYYY/MM/DD)
        - name: profileName
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by profile name
        - name: adCode
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: Filter by ad code
      responses:
        "200":
          description: EFO report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoReportResponse"
        "500":
          description: Fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get application settings
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignListResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /campaigns/{id}:
    put:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/presets:
    get:
      operationId: listEfoPresets
      tags: [efo]
      summary: List all EFO presets
      responses:
        "200":
          description: Preset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoPresetListResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createEfoPreset
      tags: [efo]
      summary: Create an EFO preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EfoPresetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoPresetResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /efo/presets/{id}:
    patch:
      operationId: renameEfoPreset
      tags: [efo]
      summary: Update an EFO preset name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EfoPresetNameInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoPresetResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: overwriteEfoPreset
      tags: [efo]
      summary: Overwrite an EFO preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EfoPresetInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EfoPresetResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEfoPreset
      tags: [efo]
      summary: Delete an EFO preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    NewsletterRow:
      type: object
      properties:
        deliveryYearMonth:
          type: string
          description: 配信年月 (YYYY/MM)
        deliveryWeek:
          type: string
          description: 配信月週 (e.g. 9月2W)
        deliveryDate:
          type: string
          description: 配信日 (YYYY/MM/DD)
        scenarioName:
          type: string
          description: シナリオ名
        segment:
          type: string
          description: セグメント
        deliveryMethod:
          type: string
          description: 配信方法
        templateName:
          type: string
          description: テンプレート名
        subject:
          type: string
          description: 件名
        deliveryCount:
          type: number
          description: 配信数
        openCount:
          type: number
          description: 開封数
        clickCount:
          type: number
          description: クリック数
        cvCount:
          type: number
          description: CV数
      required:
        - deliveryYearMonth
        - deliveryWeek
        - deliveryDate
        - scenarioName
        - segment
        - deliveryMethod
        - templateName
        - subject
        - deliveryCount
        - openCount
        - clickCount
        - cvCount

    NewsletterSyncResult:
      type: object
      properties:
        rowCount:
          type: number
          description: Number of rows synced
        optoutRowCount:
          type: ["number", "null"]
          description: Number of opt-out rows synced
        syncedAt:
          type: string
          description: ISO timestamp of sync
      required:
        - rowCount
        - syncedAt

    NewsletterOptoutItem:
      type: object
      properties:
        label:
          type: string
          description: Period label (day = YYYY/MM/DD, week = M月nW, month = YYYY/MM)
        optoutCount:
          type: number
          description: Number of opt-outs in the period
        prevOptoutCount:
          type: ["number", "null"]
          description: Number of opt-outs in the comparison period
      required:
        - label
        - optoutCount

    NewsletterOptoutSummary:
      type: object
      properties:
        optoutCount:
          type: number
          description: Total opt-outs in the selected period
        prevOptoutCount:
          type: ["number", "null"]
          description: Total opt-outs in the comparison period
      required:
        - optoutCount

    NewsletterOptoutResponse:
      type: object
      properties:
        groupBy:
          type: string
          enum: [day, week, month]
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsletterOptoutItem"
        summary:
          $ref: "#/components/schemas/NewsletterOptoutSummary"
        dataFrom:
          type: ["string", "null"]
          description: Earliest opt-out date available in the dataset (YYYY-MM-DD)
        lastSyncedAt:
          type: ["string", "null"]
      required:
        - groupBy
        - items
        - summary

    NewsletterMetrics:
      type: object
      properties:
        label:
          type: string
          description: Group label (date, week, month, or template name)
        period:
          type: string
          description: Time bucket (YYYY/MM/DD for day or Monday-start week, YYYY/MM for month)
        periodEnd:
          type: string
          description: Inclusive end date of a campaign-aligned time bucket (YYYY/MM/DD)
        subject:
          type: ["string", "null"]
          description: 件名（テンプレ別・日別など行レベルで意味を持つ場合）
        segment:
          type: ["string", "null"]
          description: セグメント名（セグメント別集計の場合）
        deliveryCount:
          type: number
        openCount:
          type: number
        clickCount:
          type: number
        cvCount:
          type: number
        optoutCount:
          type: ["number", "null"]
          description: "期間内のオプトアウト件数。groupBy が day/week/month のときだけ値が入る（シナリオ/テンプレート別の内訳は元データに無い）"
        openRate:
          type: number
          description: Open rate (openCount / deliveryCount)
        clickRate:
          type: number
          description: Click rate among opens (clickCount / openCount); zero when openCount is zero
        cvr:
          type: number
          description: Conversion rate (cvCount / deliveryCount)
        prevDeliveryCount:
          type: ["number", "null"]
          description: 前期間の配信数
        prevOpenRate:
          type: ["number", "null"]
          description: 前期間の開封率
        prevClickRate:
          type: ["number", "null"]
          description: 前期間のクリック率
        prevCvr:
          type: ["number", "null"]
          description: 前期間のCVR
      required:
        - label
        - deliveryCount
        - openCount
        - clickCount
        - cvCount
        - openRate
        - clickRate
        - cvr

    NewsletterScenarioGroup:
      type: object
      properties:
        scenarioName:
          type: string
          description: シナリオ名
        items:
          type: array
          items:
            $ref: "#/components/schemas/NewsletterMetrics"
        summary:
          $ref: "#/components/schemas/NewsletterMetrics"
      required:
        - scenarioName
        - items
        - summary

    NewsletterReportResponse:
      type: object
      properties:
        groupBy:
          type: string
